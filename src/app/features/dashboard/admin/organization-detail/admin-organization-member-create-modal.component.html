<div class="organization-request-modal__backdrop" role="presentation" (click)="cancel()"><section class="organization-request-modal" tabindex="-1" evaasModalInteraction [modalCloseDisabled]="submitting()" (modalEscape)="cancel()" role="dialog" aria-modal="true" aria-labelledby="member-create-title" (click)="$event.stopPropagation()"><header class="organization-request-modal__header"><div><p class="organization-request-modal__eyebrow">OrganizationMember</p><h2 id="member-create-title">Agregar miembro</h2><p>Organization: <strong>{{ organizationName || organizationId }}</strong></p></div><button type="button" class="organization-request-modal__link-button" (click)="cancel()" [disabled]="submitting()">Cerrar</button></header><p>Agregar miembro produce una membership <strong>MEMBER</strong>.</p><form (ngSubmit)="submit()" novalidate><label><span>Correo del usuario</span><input type="email" name="memberEmail" [(ngModel)]="userEmail" autocomplete="email" data-modal-initial-focus [disabled]="submitting() || lookupLoading() || !!selectedUser()"></label><div class="organization-request-modal__inline-actions"><button type="button" class="organization-request-modal__secondary" (click)="searchUserByEmail()" [disabled]="submitting() || lookupLoading() || !!selectedUser()">{{ lookupLoading() ? 'Buscando...' : 'Buscar usuario' }}</button><button type="button" class="organization-request-modal__link-button" *ngIf="selectedUser()" (click)="clearSelectedUser()" [disabled]="submitting()">Limpiar selección</button></div><p class="organization-request-modal__success" *ngIf="selectedUser() as user">Usuario seleccionado: {{ user.email }}</p><p class="organization-request-modal__error" role="alert" *ngIf="error()">{{ error() }}</p><footer class="organization-request-modal__actions"><button type="button" class="organization-request-modal__secondary" (click)="cancel()" [disabled]="submitting()">Cancelar</button><button type="submit" class="organization-request-modal__primary" [disabled]="submitting() || !selectedUser()">{{ submitting() ? 'Agregando...' : 'Agregar miembro' }}</button></footer></form></section></div>
