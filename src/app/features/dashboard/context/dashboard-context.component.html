<section class="py-5 text-center" aria-live="polite">
  <div *ngIf="loading()" class="d-inline-flex align-items-center gap-2">
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    <span>Resolviendo tu contexto de acceso…</span>
  </div>

  <div *ngIf="!loading() && !hasContextualRoute()" class="alert alert-warning d-inline-block text-start" role="alert">
    <strong>No hay un panel disponible para tu contexto de acceso.</strong>
    <span *ngIf="errorMessage()" class="d-block mt-1">{{ errorMessage() }}</span>
  </div>
</section>
