<section class="container py-3 ev-compact">
  <header class="d-flex justify-content-between align-items-center mb-3 p-2">
    <h2 class="h5 m-0 p-2">Proyectos</h2>
    <input class="form-control" [formControl]="search" placeholder="Buscar… (nombre, tecnología)">
  </header>

  <div *ngIf="loading()" class="d-flex justify-content-center my-5 p-2">
    <div class="spinner-border" role="status" aria-label="Cargando"></div>
  </div>

  <div class="grid" *ngIf="!loading() && items().length">
    <ev-object-card
      *ngFor="let it of items()"
      [item]="it"
      (view)="openDetails($event)"
      (remove)="openDetails($event)"><!-- reutilizo el dialog para confirmar/eliminar --></ev-object-card>
  </div>

  <p class="text-muted text-center my-5" *ngIf="!loading() && !items().length">Sin resultados.</p>

  <nav class="d-flex justify-content-between align-items-center mt-3">
    <div class="small">Total: {{ total() }}</div>
    <div class="d-flex gap-2 align-items-center">
      <button class="btn btn-outline-secondary btn-sm" (click)="prev()" [disabled]="pageIndex()===0">Anterior</button>
      <span class="small">{{ pageIndex()+1 }} / {{ pages() }}</span>
      <button class="btn btn-outline-secondary btn-sm" (click)="next()" [disabled]="(pageIndex()+1)>=pages()">Siguiente</button>
    </div>
  </nav>
</section>
