<article class="ev-card ev-card--equal text-center p-4">
  <!-- Icono principal -->
  <div class="icon-wrap mb-3">
    <i *ngIf="item.icon" class="{{ item.icon }} fs-1 text-primary"></i>
  </div>

  <!-- Título -->
  <h3 class="fw-semibold h6 mb-2">{{ item.name }}</h3>

  <!-- Tecnología + versión -->
  <div class="text-muted small mb-1" *ngIf="item?.techName || item?.version">
    <i class="bi bi-cpu me-1"></i>
    <ng-container *ngIf="item?.techName">{{ item.techName }}</ng-container>
    <ng-container *ngIf="item?.version"> · v{{ item.version }}</ng-container>
  </div>

  <!-- Cloud -->
  <div class="text-muted small mb-1" *ngIf="item?.cloud">
    <i class="bi bi-cloud me-1"></i>{{ item.cloud }}
  </div>

  <!-- Descripción -->
  <p class="small text-secondary mt-2 mb-3" *ngIf="item?.description">{{ item.description }}</p>

  <!-- Acciones -->
  <div class="actions d-flex justify-content-center gap-2 mt-auto">
    <button class="btn btn-outline-primary btn-sm" (click)="view.emit(item.id)">
      <i class="bi bi-eye me-1"></i> Ver
    </button>
    <button class="btn btn-outline-danger btn-sm" (click)="remove.emit(item.id)">
      <i class="bi bi-trash me-1"></i> Eliminar
    </button>
  </div>
</article>
