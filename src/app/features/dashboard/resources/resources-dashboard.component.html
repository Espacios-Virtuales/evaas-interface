<!-- src/app/features/resources/resources-dashboard.component.html -->
<section class="container py-4">
  <header class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Recursos de Software</h2>

    <mat-form-field appearance="outline" style="width: 320px; max-width: 100%;">
      <mat-label>Buscar</mat-label>
      <input matInput [formControl]="search" placeholder="cloud, angular, docker..." />
    </mat-form-field>
  </header>

  <table mat-table [dataSource]="items()" [trackBy]="trackById" class="mat-elevation-z1 w-100">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Tecnología </th>
      <td mat-cell *matCellDef="let r"> {{ r.displayName }} </td>
    </ng-container>

    <ng-container matColumnDef="vendor">
      <th mat-header-cell *matHeaderCellDef> Vendor </th>
      <td mat-cell *matCellDef="let r"> {{ r.vendor || '—' }} </td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef> Categoría </th>
      <td mat-cell *matCellDef="let r"> {{ r.category || '—' }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-end"> Acciones </th>
      <td mat-cell *matCellDef="let r" class="text-end">
        <button mat-raised-button color="primary" (click)="openCreate(r)" [disabled]="!r.actions?.createProject">
          <mat-icon>add</mat-icon> Crear proyecto
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols;"></tr>
  </table>

  <div class="py-2" *ngIf="loading()">Cargando…</div>
  <div class="py-2 text-danger" *ngIf="error()">{{ error() }}</div>

  <mat-paginator
    [length]="total()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="[5,10,20,50]"
    (page)="onPage($event)">
  </mat-paginator>
</section>
