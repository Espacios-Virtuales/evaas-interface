<!-- src/app/features/resources/resources-dashboard.component.html -->
<section class="resources container-fluid py-3">
    <header class="d-flex flex-wrap gap-3 align-items-center mb-3">
      <h2 class="m-0 flex-grow-1">Recursos de Software</h2>
  
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar tecnología</mat-label>
        <input matInput placeholder="angular, gcp, cloud…" [formControl]="search">
        <button mat-icon-button matSuffix aria-label="Limpiar" *ngIf="search.value" (click)="search.setValue('')">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
    </header>
  
    <!-- Estados -->
    <div class="state" *ngIf="loading()">
      <mat-progress-spinner mode="indeterminate" diameter="36"></mat-progress-spinner>
      <small class="ms-2 text-muted">Cargando…</small>
    </div>
  
    <div class="state text-danger" *ngIf="!loading() && error()">
      <mat-icon>error_outline</mat-icon>
      <span class="ms-2">{{ error() }}</span>
    </div>
  
    <div class="state text-muted" *ngIf="!loading() && !error() && !hasAnyData()">
      <mat-icon>inbox</mat-icon>
      <span class="ms-2">Sin resultados</span>
    </div>
  
    <!-- Tabla -->
    <div class="table-wrap" *ngIf="!loading() && !error() && hasAnyData()">
      <table mat-table [dataSource]="items()" class="mat-elevation-z1 w-100"> 
  
        <!-- Tecnología -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Tecnología </th>
          <td mat-cell *matCellDef="let r">
            <div class="tech">
              <span class="title">{{ r.displayName }}</span>
              <small class="muted" *ngIf="r.slug">/{{ r.slug }}</small>
            </div>
          </td>
        </ng-container> 

        <!-- Vendor -->
        <ng-container matColumnDef="vendor">
          <th mat-header-cell *matHeaderCellDef> Vendor </th>
          <td mat-cell *matCellDef="let r"> {{ r.vendor || '—' }} </td>
        </ng-container>
  
        <!-- Categoría -->
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef> Categoría </th>
          <td mat-cell *matCellDef="let r">
            <span class="badge bg-light text-dark" *ngIf="r.category; else dash">{{ r.category }}</span>
            <ng-template #dash>—</ng-template>
          </td>
        </ng-container> 
  
        <!-- Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-end"> Acciones </th>
          <td mat-cell *matCellDef="let r" class="text-end">
             <button mat-raised-button color="primary"
                    (click)="openCreate(r)"
                    [disabled]="!r.actions?.createProject">
              <mat-icon>add</mat-icon> 
              Crear proyecto
            </button> 
          </td>
        </ng-container>

      
        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols;"></tr>
      </table>   
  
        <mat-paginator class="mt-2"
                     [length]="total()"
                     [pageSize]="pageSize()"
                     [pageIndex]="pageIndex()"
                     [pageSizeOptions]="[5,10,20]"
                     (page)="onPage($event)">
      </mat-paginator>  
    </div>
  </section>
