<main class="activation-page">
  <section class="activation-panel" aria-live="polite">
    <img src="/evaas-logo.png" alt="EVAAS" class="activation-logo" />

    <div class="status-icon" [class.success]="state() === 'success'" [class.error]="state() === 'error'">
      <span *ngIf="state() === 'loading'" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <i *ngIf="state() === 'success'" class="bi bi-check-lg" aria-hidden="true"></i>
      <i *ngIf="state() === 'error'" class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    </div>

    <h1>Activación de cuenta</h1>
    <p class="status-message">{{ message() }}</p>

    <p *ngIf="state() === 'success'" class="redirect-note">
      Te llevaremos a Alta EVAAS en unos segundos.
    </p>

    <div class="resend-placeholder">
      <button type="button" class="btn btn-outline-secondary btn-sm" disabled>
        Reenviar correo de activación
      </button>
      <span>Disponible próximamente.</span>
    </div>
  </section>
</main>
