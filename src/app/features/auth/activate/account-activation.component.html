<main class="activation-page">
  <section class="activation-panel" aria-live="polite">
    <img src="/evaas-logo.png" alt="EVAAS" class="activation-logo" />

    <div class="status-icon" [class.success]="state() === 'success'" [class.error]="state() === 'error'">
      <span *ngIf="state() === 'loading'" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <i *ngIf="state() === 'success'" class="bi bi-check-lg" aria-hidden="true"></i>
      <i *ngIf="state() === 'error'" class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    </div>

    <h1>Activación de cuenta</h1>
    <p class="status-message">{{ message() }}</p>

    <p *ngIf="state() === 'success'" class="redirect-note">
      Te llevaremos a Alta EVAAS en unos segundos.
    </p>

    <div *ngIf="state() === 'error'" class="recovery-actions">
      <a class="btn btn-outline-primary btn-sm" routerLink="/auth/login">Ir a login</a>

      <form [formGroup]="resendForm" (ngSubmit)="resendActivation()" class="resend-form" novalidate>
        <label for="activation-email">Reenviar correo de activación</label>
        <div class="resend-row">
          <input
            id="activation-email"
            type="email"
            class="form-control form-control-sm"
            formControlName="email"
            placeholder="usuario@dominio.com"
            [class.is-invalid]="resendState() === 'validation' && resendForm.controls.email.invalid"
          />
          <button
            type="submit"
            class="btn btn-primary btn-sm"
            [disabled]="resendState() === 'loading'"
          >
            {{ resendState() === 'loading' ? 'Enviando...' : 'Reenviar correo' }}
          </button>
        </div>
        <p
          *ngIf="resendMessage()"
          class="resend-message"
          [class.success]="resendState() === 'success'"
          [class.error]="resendState() === 'error' || resendState() === 'validation'"
        >
          {{ resendMessage() }}
        </p>
      </form>
    </div>
  </section>
</main>
